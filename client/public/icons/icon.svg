<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="6" />

  <!-- Radar concentric circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="2" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="2" />

  <!-- Navigation Arrow pointing diagonally -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)" filter="url(#neonGlow)">
    <path
      d="M256 80 L380 390 L256 310 L132 390 Z"
      fill="url(#cyanGrad)"
      stroke="#ffffff"
      stroke-width="6"
      stroke-linejoin="round"
    />
  </g>

  <!-- Live beacon dot in center -->
  <circle cx="256" cy="256" r="14" fill="#22c55e" stroke="#0b0f19" stroke-width="3" />
</svg>
